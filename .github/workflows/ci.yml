name: HotelsVendors CI

on:
  push:
    branches: [main, production-transformation, release/demand-network-20261005, release/premium-mvp-20261005]
  pull_request:
    branches: [main, production-transformation]

concurrency:
  group: hv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: sk_test_placeholder
      SESSION_SECRET: ci-only-not-used-by-clerk
      NEXT_PUBLIC_APP_URL: https://www.hotelsvendors.com
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - name: Package standalone runtime
        run: |
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          tar -czf hv-standalone.tgz -C release .
      - name: Smoke-test packaged standalone runtime
        run: |
          set -euo pipefail
          PORT=3100 HOSTNAME=127.0.0.1 NODE_ENV=production node release/server.js >/tmp/hv-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/api/health >/tmp/hv-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/hv-smoke.log; exit 1; fi
          grep -q '"ok":true' /tmp/hv-health.json
          for path in / /login /register /marketplace /platform /solutions; do
            status=$(curl -sS --max-time 10 -o /tmp/hv-smoke-page.html -w '%{http_code}' "http://127.0.0.1:3100$path")
            if [ "$status" != '200' ]; then echo "Unexpected HTTP $status for $path"; cat /tmp/hv-smoke.log; exit 1; fi
          done
          curl -fsS --max-time 10 http://127.0.0.1:3100/ -o /tmp/hv-home.html
          grep -q 'Source smarter.' /tmp/hv-home.html
          grep -q 'HV Volume Deals' /tmp/hv-home.html
          grep -q 'Market Compass' /tmp/hv-home.html
          for path in /audit /security; do
            test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \"http://127.0.0.1:3100$path\")" = '307'
          done
          test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v2/audit)" = '401'
          css=$(grep -oE 'href="[^"]+\.css[^"]*"' /tmp/hv-home.html | sed -n '1p' | cut -d'"' -f2)
          test -n "$css"
          curl -fsS --max-time 10 "http://127.0.0.1:3100$css" -o /dev/null
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/intelligence)
          test "$status" = '307'
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/demand-aggregation)
          test "$status" = '307'
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v2/demand)
          test "$status" = '401'
      - uses: actions/upload-artifact@v4
        with:
          name: hv-standalone-${{ github.sha }}
          path: hv-standalone.tgz
          retention-days: 1
