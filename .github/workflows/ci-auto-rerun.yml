name: CI auto rerun

# Runs only from the default branch. One rerun of failed HotelsVendors CI
# jobs, and only when the first attempt failed. Deploy and recovery
# workflows are not in the trigger list and are refused by name as well.
on:
  workflow_run:
    workflows: ["HotelsVendors CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed-once:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed CI jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_name="${{ github.event.workflow_run.name }}"
          run_id="${{ github.event.workflow_run.id }}"
          case "$workflow_name" in
            "HotelsVendors CI")
              ;;
            *)
              echo "Refusing to rerun ${workflow_name}"
              exit 0
              ;;
          esac
          gh run rerun "$run_id" --failed
