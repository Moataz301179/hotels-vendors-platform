# HotelsVendors Nginx Configuration
# Source: /etc/nginx/sites-enabled/hotelsvendors.com (on VPS 187.77.181.3)
# Last synced: 2026-09-23
#
# UPSTREAM: PM2 process "hv-test" on port 3001
# This is the active merged deployment at /var/www/hv-merged-test-v2/hotels-vendors-new
#
# NOTE: Port 3001 was chosen to resolve a 502 Bad Gateway that occurred when
# the config pointed to port 3003 (the older arena-deploy process).
# Changing this port without also updating PM2 will break the live site.

server {
    server_name hotelsvendors.com www.hotelsvendors.com;

    location = /manifest.json {
        alias /hotels-vendors-new/public/manifest.json;
        default_type application/manifest+json;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hotelsvendors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotelsvendors.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.hotelsvendors.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = hotelsvendors.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name hotelsvendors.com www.hotelsvendors.com;
    return 404;
}
